# ABOUTME: CI for victrola_stream -- hassfest, HACS validation, and the test suite.
# ABOUTME: Runs on every push, pull request and manual dispatch.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # hacs/action is self-contained (it clones the target repo itself);
      # its documented example has no checkout step.
      - uses: hacs/action@main
        with:
          category: integration
          # Default "true" posts a PR comment, which needs pull-requests:
          # write; this job stays read-only without it.
          comment: false

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # astral-sh/setup-uv stopped publishing floating major-version tags
      # after v7 (releases are at v10.x); its README now pins the commit
      # SHA of the latest release instead. v10.2.0, 2026-09-21.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: scripts/check
