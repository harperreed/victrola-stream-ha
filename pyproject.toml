[project]
name = "victrola-stream-ha"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.367", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
# Ruff formats and lints fenced ```python blocks inside Markdown. This repo's
# Markdown (docs/, CLAUDE.md, gotchas.md) holds prose with illustrative, often
# intentionally-incomplete snippets; none of it is source, and the plan doc must
# never be rewritten by a tool.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
